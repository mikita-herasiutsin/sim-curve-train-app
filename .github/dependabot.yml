# Routine updates only: at most one grouped minor/patch PR per ecosystem each month.
# Major upgrades (e.g. SvelteKit 3) need migration work, so they are done as tickets on
# purpose rather than offered as PRs here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The Tauri CLI refuses to build when @tauri-apps/api and the tauri crate differ in
      # major.minor, and Dependabot can't bump npm and cargo in one PR. Do Tauri minor
      # bumps by hand in a single PR (see src/version-sync.test.ts); patches still come.
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-minor"]
      # Tracks the oldest supported Node line (`engines` in package.json), not the newest.
      - dependency-name: "@types/node"
        versions: [">=23"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pairs with the @tauri-apps/* rule above.
      - dependency-name: "tauri"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "tauri-*"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
