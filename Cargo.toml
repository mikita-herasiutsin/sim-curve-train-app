[workspace]
resolver = "3"
members = ["crates/core", "crates/telemetry-extract", "src-tauri"]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/mikita-herasiutsin/sim-curve-train-app"
authors = ["Mikita Herasiutsin"]

[workspace.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
sct-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Enforce `#[expect(lint, reason = "...")]` over `#[allow]` (see CONTRIBUTING.md).
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwind (not abort) so a panic in the input thread is caught and shown in the UI
# instead of killing the app silently (SCT-012), and a panicking drill thread still ends its run.
panic = "unwind"
strip = true
