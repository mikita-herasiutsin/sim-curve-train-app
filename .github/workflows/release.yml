name: Release

# Run it from the Actions tab (or `npm run release`) on main: it tags main with the next
# version, builds the NSIS installer and the portable exe, and publishes a GitHub Release with
# both attached. Pushing a `v*` tag by hand does the same for that tag. The committed version
# is a dev placeholder; the release version comes from the tag. See docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, e.g. 0.1.0 or 0.2.0-rc.1. Empty: next patch."
        type: string
        required: false
      prerelease:
        description: "Mark as a pre-release (always on for a version with a - suffix)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & publish release
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign build provenance
      attestations: write # store build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Only release what passed CI: the commit must be on the protected main branch. A new
      # version must sort above every existing v* tag. A tag that already points at this commit
      # is reused (a re-run, or a tag pushed by hand) unless its release is already published.
      - name: Resolve version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # versionsort.suffix=- sorts v1.0.0-rc.1 below v1.0.0.
          tags() { git -c versionsort.suffix=- tag --list 'v*' --sort=-v:refname; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Run the release from main, not $GITHUB_REF_NAME"
              exit 1
            fi
            version="${INPUT_VERSION#v}"
            latest="$(tags | head -n 1)"
            if [ -z "$version" ] && [ -n "$latest" ] &&
              [ "$(git rev-parse "refs/tags/$latest^{commit}")" = "$GITHUB_SHA" ]; then
              # A re-run after this run already tagged main: release that tag, not the next patch.
              version="${latest#v}"
            elif [ -z "$version" ]; then
              if [[ ! "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                echo "::error::Can't pick the next patch after '$latest'; enter a version"
                exit 1
              fi
              version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            fi
            prerelease="$INPUT_PRERELEASE"
          else
            version="${GITHUB_REF_NAME#v}"
            prerelease=false
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a semver version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          tag="v$version"

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main"
            exit 1
          fi
          existing="$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}" || true)"
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $tag already exists on another commit ($existing)"
            exit 1
          fi
          if [ -n "$existing" ]; then
            # Fail closed: only "release not found" means there is nothing published to overwrite.
            if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2> "$RUNNER_TEMP/gh-error.txt")"; then
              if [ "$draft" = false ]; then
                echo "::error::$tag is already released; release a new version instead"
                exit 1
              fi
            elif ! grep -q "release not found" "$RUNNER_TEMP/gh-error.txt"; then
              echo "::error::Can't check for an existing $tag release: $(cat "$RUNNER_TEMP/gh-error.txt")"
              exit 1
            fi
          else
            git tag "$tag" "$GITHUB_SHA"
            echo "PUSH_TAG=true" >> "$GITHUB_ENV"
          fi
          if [ "$(tags | head -n 1)" != "$tag" ]; then
            echo "::error::$tag is not higher than the latest tag $(tags | grep -vxF "$tag" | head -n 1)"
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"
          echo "Releasing $tag (prerelease: $prerelease) from $GITHUB_SHA"

      # A tag pushed with GITHUB_TOKEN doesn't start the push: tags trigger, so this is the
      # only build of it.
      - name: Push tag
        if: env.PUSH_TAG == 'true'
        shell: bash
        run: git push origin "refs/tags/$TAG"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      # No rust-cache here: release builds start clean so a stale artifact can't ship.
      - run: npm ci

      # Writes the version into Cargo.toml, package.json and both lockfiles on the runner, so
      # the file names and the in-app version match the tag.
      - name: Set version
        shell: bash
        run: node scripts/set-version.mjs "$APP_VERSION"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: SimCurveTrainApp ${{ env.TAG }}
          # Drafted first and published by the last step, once every check passed.
          releaseDraft: true
          prerelease: ${{ env.PRERELEASE == 'true' }}
          generateReleaseNotes: true
          releaseBody: |
            ## Install

            - **Installer:** `SimCurveTrainApp_${{ env.APP_VERSION }}_x64-setup.exe`
            - **Portable:** `SimCurveTrainApp_windows_x64.exe` (needs WebView2, preinstalled on Windows 11)

            The builds are not code-signed yet, so Windows SmartScreen warns on first run: click **More info**, then **Run anyway**. See the [install notes](https://github.com/${{ github.repository }}#install-windows).
          # Also attach target/release/SimCurveTrainApp.exe, as SimCurveTrainApp_windows_x64.exe.
          uploadPlainBinary: true
          # The action runs `npm run tauri build --`, so this reaches cargo as `--locked`.
          args: -- --locked

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # The installer and the portable exe.
          subject-path: |
            target/release/bundle/nsis/*.exe
            target/release/SimCurveTrainApp.exe

      # tauri-action skips artifacts it can't find instead of failing, so check both arrived.
      - name: Check release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[].name')"
          echo "$assets"
          for name in "SimCurveTrainApp_${APP_VERSION}_x64-setup.exe" "SimCurveTrainApp_windows_x64.exe"; do
            if ! grep -qxF "$name" <<< "$assets"; then
              echo "::error::Release asset $name is missing"
              exit 1
            fi
          done

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false \
            --jq '"Published " + .html_url'
