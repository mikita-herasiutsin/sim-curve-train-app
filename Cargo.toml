[workspace]
resolver = "3"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/mikita-herasiutsin/sim-curve-train-app"
authors = ["Mikita Herasiutsin"]

[workspace.dependencies]
sct-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Enforce `#[expect(lint, reason = "...")]` over `#[allow]` (see CONTRIBUTING.md).
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
