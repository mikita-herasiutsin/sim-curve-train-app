[package]
name = "sim-curve-train-app"
description = "Sim racing pedal muscle-memory trainer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "sim_curve_train_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sct-core.workspace = true
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
